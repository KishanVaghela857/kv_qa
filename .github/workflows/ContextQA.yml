name: contextqa-qa

on:
  workflow_dispatch:
    inputs:
      plan-id:
        description: QA test plan ID
        default: '1232'
      token:
        description: Which token to use
        type: choice
        options: [full, limited]
        default: full
      junit:
        description: Write the JUnit XML report
        type: boolean
        default: true
      fail-on:
        description: failure = job fails when the plan fails; never = only report
        type: choice
        options: [never, failure]
        default: never

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Run ContextQA test plan (fix CON-6433)
        id: contextqa
        uses: aagam-salot/contextqa-ci@fix/con-6433-ci-report-names-duration
        with:
          plan-id: ${{ inputs.plan-id }}
          token: ${{ inputs.token == 'full' && secrets.CONTEXTQA_QA_TOKEN_FULL || secrets.CONTEXTQA_QA_TOKEN_LIMITED }}
          api-url: https://server.dev.contextqa.com
          junit-path: ${{ inputs.junit && 'reports/contextqa.xml' || '' }}
          fail-on: ${{ inputs.fail-on }}

      - name: Upload the report and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextqa-report
          path: reports/
          if-no-files-found: ignore
